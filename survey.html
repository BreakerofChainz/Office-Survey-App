<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Survey · Sky Forged Labs</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="bg-grid"></div>

  <header class="site-header">
    <div class="logo">
      <span class="logo-icon">◈</span>
      <span class="logo-text">Sky Forged Labs</span>
    </div>
    <nav class="site-nav">
      <a href="index.html" class="nav-link">Home</a>
      <a href="survey.html" class="nav-link active">Survey</a>
      <a href="privacy.html" class="nav-link">Privacy</a>
    </nav>
  </header>

  <main class="survey-main">
    <div class="survey-shell">

      <!-- Progress Bar -->
      <div class="progress-header" id="progressHeader">
        <div class="progress-label">
          <span id="questionCounter">Question 1 of 10</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="progressFill" style="width:10%"></div>
        </div>
      </div>

      <!-- Question Card -->
      <div class="question-card" id="questionCard">
        <div class="q-number" id="qNumber">01</div>
        <h2 class="q-text" id="qText"></h2>
        <div class="options-grid" id="optionsGrid"></div>
        <div class="survey-actions">
          <button class="btn-secondary" id="backBtn" style="display:none;">
            <span class="btn-arrow-left">←</span>
            <span>Back</span>
          </button>
          <button class="btn-primary" id="submitBtn" disabled>
            <span id="submitLabel">Next Question</span>
            <span class="btn-arrow">→</span>
          </button>
        </div>
      </div>

      <!-- Thank You Screen (hidden) -->
      <div class="thankyou-card" id="thankyouCard" style="display:none;">
        <div class="ty-icon">✦</div>
        <h2 class="ty-title">Thank You!</h2>
        <p class="ty-sub">Your responses have been recorded. We appreciate you taking a moment to participate in this survey.</p>
        <div class="ty-summary" id="tySummary"></div>
        <a href="index.html" class="btn-secondary">← Back to Home</a>
      </div>

    </div>
  </main>

  <footer class="site-footer">
    <span>© 2025 Sky Forged Labs · Home Lab Project</span>
    <a href="privacy.html">Privacy</a>
  </footer>

  <script src="survey.js"></script>
</body>
</html>
