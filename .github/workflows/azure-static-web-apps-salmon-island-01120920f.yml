name: Deploy SWA (main only)

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      # Fail fast with a clear message if the secret isn't being provided
      - name: Verify deployment token exists
        shell: bash
        run: |
          if [ -z "${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}" ]; then
            echo "ERROR: AZURE_STATIC_WEB_APPS_API_TOKEN secret is missing or not being provided to this workflow."
            exit 1
          fi

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "upload"
          app_location: "/"          # repo root contains index.html
          output_location: ""        # no build output
          api_location: ""           # no API yet
          skip_app_build: true       # prevents Oryx from trying npm build
